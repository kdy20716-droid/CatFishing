<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="catGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
  </defs>

  <!-- Circular Ocean Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#caf0f8" stroke-width="2.5"/>

  <!-- Water Wave Ripple -->
  <path d="M6 38 Q18 33 32 38 T58 38 L58 60 L6 60 Z" fill="#0096c7" opacity="0.6"/>

  <!-- Cat Ears -->
  <polygon points="18,24 12,10 26,18" fill="url(#catGrad)"/>
  <polygon points="18,22 15,14 23,19" fill="#ffafcc"/>

  <polygon points="46,24 52,10 38,18" fill="url(#catGrad)"/>
  <polygon points="46,22 49,14 41,19" fill="#ffafcc"/>

  <!-- Cat Head -->
  <ellipse cx="32" cy="28" rx="16" ry="14" fill="url(#catGrad)"/>

  <!-- Straw Hat on Cat -->
  <ellipse cx="32" cy="18" rx="19" ry="5" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="1.2"/>
  <rect x="22" y="9" width="20" height="9" rx="3" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="1.2"/>
  <rect x="22" y="15" width="20" height="3" fill="#e63946"/>

  <!-- Cute Eyes -->
  <circle cx="26" cy="27" r="2.5" fill="#212529"/>
  <circle cx="38" cy="27" r="2.5" fill="#212529"/>
  <circle cx="27" cy="26" r="0.8" fill="#ffffff"/>
  <circle cx="39" cy="26" r="0.8" fill="#ffffff"/>

  <!-- Nose & Mouth -->
  <polygon points="32,30 30.5,32 33.5,32" fill="#ffafcc"/>
  <path d="M30 33 Q32 35 34 33" stroke="#212529" stroke-width="1.2" fill="none"/>

  <!-- Cheeks -->
  <circle cx="23" cy="30" r="2.5" fill="#ff758f" opacity="0.6"/>
  <circle cx="41" cy="30" r="2.5" fill="#ff758f" opacity="0.6"/>

  <!-- Small Caught Fish in Mouth -->
  <ellipse cx="32" cy="46" rx="8" ry="4" fill="#ff4d6d" transform="rotate(-15 32 46)"/>
  <polygon points="38,44 44,40 42,48" fill="#ff4d6d" transform="rotate(-15 32 46)"/>
  <circle cx="27" cy="45" r="1.2" fill="#ffd166"/>
</svg>
